<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Tools</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: Arial, sans-serif; background: #0a0a12; color: #fff; }
        .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #0f0f1a; display: flex; flex-direction: column; }
        .header { padding: 20px; background: #141422; border-bottom: 1px solid #2a2a3e; }
        .header h1 { font-size: 20px; color: #8b5cf6; }
        .content { flex: 1; padding: 20px; }
        .content h2 { color: #8b5cf6; margin-bottom: 10px; }
        .content p { color: #a0a0b8; }
        .nav { display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 0; background: #141422; border-top: 1px solid #2a2a3e; }
        .nav button { background: none; border: none; color: #6a6a82; padding: 8px; cursor: pointer; font-size: 10px; }
        .nav button.active { color: #8b5cf6; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header"><h1>🚀 GM Tools</h1></div>
        <div class="content">
            <h2 id="page-title">Главная</h2>
            <p id="page-text">Добро пожаловать в GM Tools!</p>
        </div>
        <div class="nav">
            <button class="active" onclick="switchTab('home')">🏠 Главная</button>
            <button onclick="switchTab('templates')">📄 Шаблоны</button>
            <button onclick="switchTab('stats')">📊 Статистика</button>
            <button onclick="switchTab('settings')">⚙️ Настройки</button>
        </div>
    </div>
    <script>
        function switchTab(tab) {
            const titles = { home: 'Главная', templates: 'Шаблоны', stats: 'Статистика', settings: 'Настройки' };
            const texts = {
                home: 'Добро пожаловать в GM Tools!',
                templates: 'Здесь будут твои шаблоны.',
                stats: 'Здесь будет статистика.',
                settings: 'Здесь будут настройки.'
            };
            document.getElementById('page-title').textContent = titles[tab];
            document.getElementById('page-text').textContent = texts[tab];
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.nav button')[['home','templates','stats','settings'].indexOf(tab)].classList.add('active');
        }
    </script>
</body>
</html>
